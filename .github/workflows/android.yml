name: Android APK

on:
  push:
    paths:
      - "RemoteDesk/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "RemoteDesk/android/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RemoteDesk/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RemoteDesk-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RemoteDesk-android
          path: RemoteDesk/android/RemoteDesk-android.apk
          if-no-files-found: error

      - name: Commit APK to the branch
        if: github.event_name != 'pull_request'
        working-directory: .
        run: |
          mkdir -p RemoteDesk/dist
          cp RemoteDesk/android/RemoteDesk-android.apk RemoteDesk/dist/RemoteDesk-android.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RemoteDesk/dist/RemoteDesk-android.apk
          git diff --cached --quiet && exit 0
          git commit -m "Android APK build from ${GITHUB_SHA::7}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
